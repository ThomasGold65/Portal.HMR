<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Housing Management Portaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14222E;--card:#FFFFFF;--ink:#16232E;--accent:#A9834F;--gold:#C9A46D;--muted:#6A7480;--line:#E6DFD3;--bad:#B0463A;--bad-soft:#F8E3DF;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.wrap{width:100%;max-width:400px;display:grid;gap:28px}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;color:#F3EEE6}
.mark{width:42px;height:42px;border:1.5px solid var(--gold);border-radius:4px;display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:600}
.wm{font-family:var(--serif);font-size:25px;line-height:1;font-weight:600}
.wm small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);margin-top:5px;font-weight:500}
.card{background:var(--card);border-radius:16px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:0 0 6px}
h1 em{color:var(--accent)}
p{margin:0 0 22px;color:var(--muted);font-size:14px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
input{font:inherit;color:var(--ink);padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
button{font:inherit;font-weight:600;margin-top:6px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.7;cursor:wait}
.err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:10px 12px;font-size:13.5px}
.foot{text-align:center;color:#8E9AA5;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="mark">H</div><div class="wm">Housing Management<small>Eigenaarsportaal</small></div></div>
  <div class="card">
    <h1>Welkom <em>terug.</em></h1>
    <p>Log in om uw portefeuille te bekijken.</p>
    <form id="f" autocomplete="on">
      <label>Gebruikersnaam<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Wachtwoord<input id="p" name="password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="e" hidden>Gebruikersnaam of wachtwoord klopt niet. Controleer hoofdletters en probeer het opnieuw.</div>
      <button id="b">Inloggen</button>
    </form>
  </div>
  <div class="foot">Housing Management · Boompjes 40, Rotterdam</div>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(u,p){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+'\n'+p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(V.s),iterations:V.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function open_(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(V.i)},key,b64(V.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close()}
(async()=>{try{const raw=sessionStorage.getItem('hm-k');if(raw){const k=await crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']);show(await open_(k))}}catch(_){try{sessionStorage.removeItem('hm-k')}catch(e){}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const btn=document.getElementById('b'),err=document.getElementById('e');
  err.hidden=true;btn.disabled=true;btn.textContent='Bezig met inloggen…';
  try{
    const k=await keyFrom(document.getElementById('u').value,document.getElementById('p').value);
    const html=await open_(k);
    try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));sessionStorage.setItem('hm-k',btoa(String.fromCharCode(...raw)))}catch(_){}
    show(html);
  }catch(_){err.hidden=false;btn.disabled=false;btn.textContent='Inloggen';document.getElementById('p').select()}
});
